name: iOS CI

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: ios

    env:
      XCODE_PROJECT: EmojiApp.xcodeproj
      XCODE_SCHEME: EmojiApp
      DERIVED_DATA_PATH: ${{ runner.temp }}/EmojiAppDerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Select simulator destination
        run: |
          set -euo pipefail

          xcrun simctl list devices available

          for simulator_name in "iPhone 16" "iPhone 16 Pro" "iPhone 15" "iPhone 15 Pro"; do
            if xcrun simctl list devices available | grep -q "^[[:space:]]*$simulator_name ("; then
              echo "IOS_SIM_DESTINATION=platform=iOS Simulator,name=$simulator_name" >> "$GITHUB_ENV"
              echo "Selected simulator: $simulator_name"
              exit 0
            fi
          done

          echo "No supported iPhone Simulator destination is available." >&2
          exit 1

      - name: Show Xcode destinations
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showdestinations

      - name: Build Debug for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "$IOS_SIM_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run XCTest on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "$IOS_SIM_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release for iOS SDK
        run: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build
